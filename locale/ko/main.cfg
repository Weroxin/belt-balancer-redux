[entity-name]
balancer-part=밸런서 부품

[entity-description]
balancer-part=나란히 놓은 부품은 하나의 밸런서가 됩니다. 밸런서로 들어가는 벨트는 입력, 밸런서에서 나가는 벨트는 출력입니다. 아이템은 모든 출력에 균등하게 분배됩니다.

[technology-name]
belt-balancer=벨트 밸런서

[technology-description]
belt-balancer=아이템을 원하는 수의 벨트에 균등하게 분배하는 밸런서 부품.

[recipe-name]
belt-balancer-normal-belt=__ENTITY__balancer-part__ (__ENTITY__transport-belt__)
belt-balancer-fast-belt=__ENTITY__balancer-part__ (__ENTITY__fast-transport-belt__)
belt-balancer-express-belt=__ENTITY__balancer-part__ (__ENTITY__express-transport-belt__)
belt-balancer-turbo-belt=__ENTITY__balancer-part__ (__ENTITY__turbo-transport-belt__)
