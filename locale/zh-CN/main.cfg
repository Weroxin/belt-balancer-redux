[entity-name]
balancer-part=平衡器部件

[entity-description]
balancer-part=相邻放置的部件会组成一个平衡器。通向它的传送带是输入，从它引出的传送带是输出。物品会平均分配到所有输出上。

[technology-name]
belt-balancer=传送带平衡器

[technology-description]
belt-balancer=可将物品平均分配到任意数量传送带上的平衡器部件。

